schema: steward/v1

repo:
  id: skill_steward
  archetype: meta_steward

harness:
  name: steward
  mode: cli
  entrypoints:
    cli: steward

adoption:
  status: adopting
  owner: skill-steward
  gate:
    pillar: quality

stewardship:
  governance:
    north_star: "docs/NORTH_STAR.mdx"
    adr_dir: "docs/decisions"
    faq:
      design: "docs/DESIGN_FAQ.mdx"
      dx: "docs/DX_FAQ.mdx"
  knowledge:
    docs_map: "AGENTS.md"
    source_policy: required_for_external_claims
  skill_lifecycle:
    installable_skills: true
    registry: "skills.sh.json"
  quality:
    validate: "pnpm run validate"
    skill_eval: "pnpm run eval"
  harness:
    enabled: true
    action_contract: actions
  release:
    changelog: changesets
    artifact_provenance: required
  review_handoff:
    moe_required_for_architecture: true
    handoff_required_for_multi_agent_work: true
  strategic_alignment:
    vision_source: "docs/NORTH_STAR.mdx"
    success_evidence: required
    falsifiers: required
  security:
    action_effects: required
    redaction: steward/redaction/v1
  org:
    owners: "CODEOWNERS"

branding:
  banned_words: ["unlock", "supercharge", "ultimate", "leverage"]
  ignored_paths: ["docs/brand.mdx", "skills/"]

governance:
  adr_directory: "docs/decisions/"
  faq_paths:
    design: "docs/DESIGN_FAQ.mdx"
    dx: "docs/DX_FAQ.mdx"
  ethics_charter: "docs/NORTH_STAR.mdx"

skills_distribution:
  source_dir: "skills/"
  output: "skills.sh.json"

provenance:
  dependencies: []
  artifacts: []
  benchmarks: []

actions:
  validate.skills:
    kind: command
    desc: Validate installable Skill Steward skills and generated indexes.
    command:
      argv: ["pnpm", "run", "validate"]
      shell: false
    cwd: "."
    effects:
      fs_read: ["."]
      fs_write:
        - "packages/steward_cli/.dart_tool/**"
        - "packages/steward_cli/pubspec.lock"
      git: read
      network: true
      secrets: false
      destructive: false
    safety:
      class: external
      default_policy: confirm
      requires_confirmation: true
    limits:
      timeout_ms: 120000
      max_output_bytes: 200000
      max_files: 20000
      max_parallelism: 4
    outputs:
      - id: stdout
        kind: stream
        required: true
        retention: summary
        format: text
    evidence:
      redaction: steward/redaction/v1
      summary_fields: [exit_code, duration_ms, output_digest]

  eval.skills:
    kind: command
    desc: Run Tier-1 rule-based skill evals.
    command:
      argv: ["pnpm", "run", "eval"]
      shell: false
    cwd: "."
    effects:
      fs_read: ["."]
      fs_write:
        - "packages/steward_cli/.dart_tool/**"
        - "packages/steward_cli/pubspec.lock"
      git: read
      network: true
      secrets: false
      destructive: false
    safety:
      class: external
      default_policy: confirm
      requires_confirmation: true
    limits:
      timeout_ms: 120000
      max_output_bytes: 200000
      max_files: 20000
      max_parallelism: 4
    outputs:
      - id: stdout
        kind: stream
        required: true
        retention: summary
        format: text
    evidence:
      redaction: steward/redaction/v1
      summary_fields: [exit_code, duration_ms, output_digest]

probes:
  quick:
    profile: quick
    actions: []
  standard:
    profile: standard
    actions: [validate.skills, eval.skills]

diagnostics:
  cases: {}

unknown_cases:
  path: ".steward/unknown-cases"
  retention: local
