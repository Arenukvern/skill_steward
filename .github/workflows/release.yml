name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Existing tag to build release assets, create or update the GitHub
          Release, and queue MCP Registry publish (e.g. v0.7.0). Does not
          create, move, or delete tags.
        required: true
        type: string

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
        && format('release-tag-{0}', github.event.inputs.release_tag)
        || format('release-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  release-finish:
    name: Finish existing release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_ready: ${{ steps.dispatch-info.outputs.release_ready }}
      release_tag: ${{ steps.dispatch-info.outputs.release_tag }}
      release_version: ${{ steps.dispatch-info.outputs.release_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ github.event.inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Finish existing release tag
        id: dispatch-info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG_INPUT"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_tag must match vX.Y.Z (got: $tag)."
            exit 1
          fi
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null || {
            echo "::error::Tag $tag does not exist on this repository."
            exit 1
          }
          tag_sha="$(git rev-list -n 1 "$tag")"
          head_sha="$(git rev-parse HEAD)"
          if [[ "$tag_sha" != "$head_sha" ]]; then
            echo "::error::Checked out $head_sha but tag $tag points to $tag_sha."
            exit 1
          fi
          version="${tag#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "$pkg_version" != "$version" ]]; then
            echo "::error::Tag $tag has package.json version $pkg_version; expected $version."
            exit 1
          fi
          if ! grep -Eq "^##[[:space:]]+$version([[:space:]]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version on tag $tag."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::GitHub Release $tag already exists; assets will be rebuilt and re-uploaded."
          fi
          {
            echo "release_ready=true"
            echo "release_version=$version"
            echo "release_tag=$tag"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_ready: ${{ steps.push-info.outputs.release_ready }}
      release_tag: ${{ steps.push-info.outputs.release_tag }}
      release_version: ${{ steps.push-info.outputs.release_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so changeset version can diff correctly
          fetch-depth: 0
          persist-credentials: false
          # Use a PAT if you want CI to re-trigger on the Version PR;
          # GITHUB_TOKEN is fine for most flows.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # Two-mode operation (handled automatically by changesets/action):
      #   MODE A — pending changesets on main:
      #     → creates/updates a PR titled "chore: version packages"
      #     → that PR bumps package.json, writes CHANGELOG.md, removes .changeset/*.md
      #   MODE B — Version PR just merged (no pending changesets):
      #     → runs `publish` script (tags the release)
      #     → downstream jobs in this workflow build assets and create the GitHub Release
      - name: Create Version PR or tag & GitHub Release
        id: changesets
        uses: changesets/action@v1
        with:
          # Custom version script to sync pubspec.yaml version
          version: pnpm changeset:version
          # Script run in MODE B only — no npm publish, just git tag
          publish: pnpm run release:tag
          # PR title & commit message used in MODE A
          title: "chore: version packages"
          commit: "chore: version packages"
          # This repo releases a private package plus binary assets, so GitHub
          # Releases are created below after the release artifacts are built.
          createGithubReleases: false
          # GPG-signed commits attributed to GITHUB_TOKEN owner;
          # no git CLI config needed, works without a PAT.
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release tag
        id: push-info
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version#v}"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null
          tag_sha="$(git rev-list -n 1 "$tag")"
          head_sha="$(git rev-parse HEAD)"
          if [[ "$tag_sha" != "$head_sha" ]]; then
            echo "Release tag $tag points to $tag_sha, not HEAD $head_sha." >&2
            exit 1
          fi
          {
            echo "release_ready=true"
            echo "release_version=$version"
            echo "release_tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build-release-assets:
    name: Build release assets (${{ matrix.triple }})
    needs: [release, release-finish]
    if: >-
      !cancelled() && (
        needs.release.outputs.release_ready == 'true' ||
        needs.release-finish.outputs.release_ready == 'true'
      )
    env:
      RELEASE_TAG: ${{ needs.release.outputs.release_tag || needs.release-finish.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.release_version || needs.release-finish.outputs.release_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: darwin-arm64
            # macos-14 arm64 runners retired 2026-11-02; macos-15 is Apple Silicon.
            runner: macos-15
          - triple: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Assert checkout at release tag
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null
          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          head_sha="$(git rev-parse HEAD)"
          if [[ "$tag_sha" != "$head_sha" ]]; then
            echo "::error::Checkout is $head_sha but refs/tags/$RELEASE_TAG is $tag_sha." >&2
            exit 1
          fi

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install steward_cli dependencies
        working-directory: packages/steward_cli
        run: dart pub get

      - name: Build release artifact
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
          RELEASE_TRIPLE: ${{ matrix.triple }}
        run: |
          bash scripts/build_release_artifacts.sh \
            --version "$RELEASE_VERSION" \
            --triple "$RELEASE_TRIPLE"

      - name: Upload release tarball
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.triple }}
          path: dist/release/steward_*_${{ matrix.triple }}.tar.gz
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [release, release-finish, build-release-assets]
    if: >-
      !cancelled() && (
        needs.release.outputs.release_ready == 'true' ||
        needs.release-finish.outputs.release_ready == 'true'
      )
    env:
      RELEASE_TAG: ${{ needs.release.outputs.release_tag || needs.release-finish.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.release.outputs.release_version || needs.release-finish.outputs.release_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Assert checkout at release tag
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null
          tag_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          head_sha="$(git rev-parse HEAD)"
          if [[ "$tag_sha" != "$head_sha" ]]; then
            echo "::error::Checkout is $head_sha but refs/tags/$RELEASE_TAG is $tag_sha." >&2
            exit 1
          fi

      - name: Download release tarballs
        uses: actions/download-artifact@v6
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist/release
          sha256sum ./*.tar.gz > checksums.txt

      - name: Extract release notes
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys

          version = os.environ["RELEASE_VERSION"]
          changelog = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(
              rf"^## {re.escape(version)}\n(?P<body>.*?)(?=^## |\Z)",
              changelog,
              flags=re.M | re.S,
          )
          if not match:
              sys.exit(f"Could not find CHANGELOG.md section for {version}")
          pathlib.Path("release-notes.md").write_text(match.group("body").strip() + "\n")
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --verify-tag \
              --latest
          fi
          gh release upload "$RELEASE_TAG" dist/release/*.tar.gz dist/release/checksums.txt --clobber

      - name: Verify release trust contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          bash scripts/verify_release.sh \
            --repo "$GITHUB_REPOSITORY" \
            --version "$RELEASE_VERSION"

      # gh release create uses GITHUB_TOKEN, so tag/release push does not fire
      # dependent workflows; dispatch MCP publish explicitly after assets upload.
      - name: Queue MCP Registry publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        run: |
          set -euo pipefail
          gh workflow run publish_mcp_registry.yml \
            -f version="${RELEASE_VERSION}"
