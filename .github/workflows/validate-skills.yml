name: Validate skills

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Dart pub get (steward_cli)
        working-directory: packages/steward_cli
        run: dart pub get

      - name: Analyze steward_cli (xsoulspace_lints)
        working-directory: packages/steward_cli
        run: dart analyze --fatal-infos

      - name: Unit tests (steward_cli)
        working-directory: packages/steward_cli
        run: dart test

      - name: Validate skills
        working-directory: packages/steward_cli
        run: dart run :steward validate

      - name: Eval skills (Tier-1 rule-based)
        working-directory: packages/steward_cli
        run: dart run :steward eval

      - name: List skills (steward CLI smoke)
        working-directory: packages/steward_cli
        run: dart run :steward list

      - name: Validate skills.sh.json schema reference
        run: node -e "JSON.parse(require('fs').readFileSync('skills.sh.json','utf8'))"

      - name: Check docs.page links (docs.json + docs/)
        run: pnpm run docs:check
