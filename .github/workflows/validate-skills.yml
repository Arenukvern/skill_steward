name: Validate skills

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Dart pub get (guild_cli)
        working-directory: packages/guild_cli
        run: dart pub get

      - name: Validate skills (guild CLI)
        working-directory: packages/guild_cli
        run: dart run :guild validate

      - name: List skills (guild CLI smoke)
        working-directory: packages/guild_cli
        run: dart run :guild list

      - name: Validate skills.sh.json schema reference
        run: node -e "JSON.parse(require('fs').readFileSync('skills.sh.json','utf8'))"

      - name: Check docs.page links (docs.json + docs/)
        run: pnpm run docs:check
