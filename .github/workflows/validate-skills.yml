name: Validate skills

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate SKILL.md packages
        run: npm run validate

      - name: Validate skills.sh.json schema reference
        run: node -e "JSON.parse(require('fs').readFileSync('skills.sh.json','utf8'))"
