name: Changesets

on:
  pull_request:
    branches: [main, master]

jobs:
  require-changeset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1 || true

      - name: Require changeset on consumer-facing diffs
        env:
          SKIP_CHANGESET_CHECK: ${{ (contains(github.event.pull_request.title, '[skip changeset]') || startsWith(github.head_ref, 'changeset-release/')) && '1' || '' }}
        run: bash scripts/changeset-check.sh "origin/${{ github.base_ref }}"
