id: guild-validate-on-save
version: "0.1.0"
description: Cursor hook — run skill validation after SKILL.md edits in this repo.

skills:
  - skill-spec-review

targets:
  cursor:
    hooks:
      - event: afterFileEdit
        script: hooks/validate-on-skill-edit.sh
        note: Merge hooks.json.snippet into .cursor/hooks.json (not installed by npx skills)
