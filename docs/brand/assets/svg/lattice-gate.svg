<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  width="200"
  height="200"
  aria-labelledby="title desc"
  role="img"
>
  <title id="title">Skill Steward — Lattice Gate</title>
  <desc id="desc">
    Reduced open rectangular frame constructed from fine lines, suggesting both the concept document lattice and ethical boundaries/gates.
    Secondary mark emphasizing buildership and careful structure.
    Master vector per ADR 0012.
  </desc>

  <!-- 
    Lattice Gate — Vector Master
    A highly reduced, open geometric frame.
    Three to four fine vertical and horizontal lines forming a gate-like structure with generous openings.
    Emphasizes structure without enclosure.

    Recommended for secondary uses where "builder" or "ethical boundary" emphasis is desired.
  -->

  <g
    fill="none"
    stroke="currentColor"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Outer open frame -->
    <!-- Left verticals -->
    <line x1="42" y1="36" x2="42" y2="164" />
    <line x1="58" y1="36" x2="58" y2="164" />

    <!-- Right verticals -->
    <line x1="142" y1="36" x2="142" y2="164" />
    <line x1="158" y1="36" x2="158" y2="164" />

    <!-- Top horizontals (open in center) -->
    <line x1="36" y1="42" x2="78" y2="42" />
    <line x1="122" y1="42" x2="164" y2="42" />

    <!-- Bottom horizontals (open in center) -->
    <line x1="36" y1="158" x2="78" y2="158" />
    <line x1="122" y1="158" x2="164" y2="158" />

    <!-- Subtle inner lattice threads (very reduced) -->
    <line x1="50" y1="58" x2="50" y2="142" stroke-width="1.75" />
    <line x1="150" y1="58" x2="150" y2="142" stroke-width="1.75" />
    <line x1="58" y1="70" x2="142" y2="70" stroke-width="1.75" />
    <line x1="58" y1="130" x2="142" y2="130" stroke-width="1.75" />
  </g>
</svg>
