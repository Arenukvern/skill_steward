<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 28" width="192" height="28" role="img" aria-label="maintained with Skill Steward">
  <!-- Capsule Background & Border -->
  <rect x="0.5" y="0.5" width="191" height="27" rx="14" fill="#0D1110" stroke="#4A7C6F" stroke-width="1"/>
  
  <!-- Growth Ring Emblem (x=7, y=5, width=18, height=18) -->
  <svg x="7" y="5" width="18" height="18" viewBox="0 0 200 200">
    <g fill="none" stroke="#4A7C6F" stroke-linecap="round">
      <circle cx="100" cy="100" r="88" stroke-width="14" stroke-dasharray="480 85" stroke-dashoffset="-42" />
      <circle cx="100" cy="100" r="68" stroke-width="11.5" stroke-dasharray="370 65" stroke-dashoffset="-32" />
      <circle cx="100" cy="100" r="48" stroke-width="9.5" stroke-dasharray="260 50" stroke-dashoffset="-23" />
      <circle cx="100" cy="100" r="28" stroke-width="7.5" stroke-dasharray="150 35" stroke-dashoffset="-15" />
      <line x1="100" y1="100" x2="155.8" y2="45.2" stroke-width="6" stroke-linecap="square" />
    </g>
  </svg>

  <!-- Typography -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#E8E4D9">
    <text x="32" y="17.5">maintained with <tspan font-weight="bold" fill="#C5A26F">Skill Steward</tspan></text>
  </g>
</svg>
